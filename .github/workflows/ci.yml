name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Tipos
        run: npx tsc -b

      - name: Lint
        run: npx eslint . --max-warnings=0

      # Solo el proyecto web. El de server pega contra una rama real de Neon y
      # necesitaria la credencial como secret, asi que se queda en local.
      - name: Tests
        run: npx vitest run --project web

      - name: Build
        run: npx vite build
