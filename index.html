<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- iOS convierte en enlaces lo que sus data detectors leen como dirección o fecha; en los pasos
         de una receta ("Ralla los 130 g...") eso acaba abriendo Maps -->
    <meta name="format-detection" content="telephone=no, address=no, date=no, email=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- maximum-scale=1 evita el auto-zoom de iOS al enfocar inputs <16px; Safari lo ignora para el pinch manual -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f97316" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Recetarium" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&display=swap"
      rel="stylesheet"
    />
    <title>Recetarium</title>
    <!-- El tema se aplica antes del primer pintado. Si esperásemos al efecto de
         useDarkMode, la app abriría en blanco y saltaría a oscuro al montar; con
         la landing de login por delante, ese destello sería una pantalla entera. -->
    <script>
      (function () {
        var guardado = localStorage.getItem('dark-mode')
        var oscuro =
          guardado === null
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
            : guardado === 'true'
        document.documentElement.classList.toggle('dark', oscuro)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
